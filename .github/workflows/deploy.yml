name: Build and Deploy Portfolio

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5

      - name: Compile backend engineer resume
        uses: xu-cheng/latex-action@v3
        with:
          root_file: backend-engineer.tex
          working_directory: resumes

      - name: Compile AI/ML engineer resume
        uses: xu-cheng/latex-action@v3
        with:
          root_file: ai-ml-engineer.tex
          working_directory: resumes

      - name: Compile security-focused developer resume
        uses: xu-cheng/latex-action@v3
        with:
          root_file: security-focused-developer.tex
          working_directory: resumes

      - name: Copy generated PDFs into site output
        run: |
          mkdir -p site/resumes
          cp resumes/backend-engineer.pdf site/resumes/backend-engineer.pdf
          cp resumes/ai-ml-engineer.pdf site/resumes/ai-ml-engineer.pdf
          cp resumes/security-focused-developer.pdf site/resumes/security-focused-developer.pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
